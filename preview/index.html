<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inkspace — editor test workspace</title><link rel="stylesheet" href="/styles.css"><style>
:root{--background-primary:#fff;--background-secondary:#f3f5fa;--background-modifier-border:#e0e6f0;--background-modifier-hover:#eef3ff;--text-normal:#26344f;--text-muted:#7b879c;--text-accent:#4775eb;--font-interface:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;font-family:var(--font-interface);background:#e9edf5;color:var(--text-normal)}.app{display:grid;grid-template-columns:210px 1fr;height:100vh;padding:18px;gap:1px}.sidebar{background:#f6f8fc;border-radius:18px 0 0 18px;padding:24px 16px}.brand{font-size:21px;font-weight:750;letter-spacing:-.8px;color:#2f4f99;display:flex;gap:9px;align-items:center}.brand em{font-style:normal;background:#4775eb;color:#fff;padding:3px 8px;border-radius:8px}.sub{color:#8a97ac;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;margin:12px 0 34px}.nav-title{font-size:10px;font-weight:700;letter-spacing:1.6px;color:#909bb0;margin-bottom:12px}.note-link{display:block;border:0;background:none;text-align:left;width:100%;padding:12px;border-radius:9px;color:#6d7b93;font-size:12px;cursor:pointer}.note-link.active{background:#e8eefc;color:#3b66cb;font-weight:650}.small{font-size:11px;color:#8b97aa;line-height:1.8;margin:30px 10px}.workspace{background:white;border-radius:0 18px 18px 0;overflow:hidden;display:flex;flex-direction:column}.topbar{height:62px;flex:none;border-bottom:1px solid #e6ebf3;padding:0 25px;display:flex;align-items:center;justify-content:space-between}.crumb{font-size:12px;color:#96a1b4}.crumb strong{color:#60708d;font-weight:500}.pill{font-size:10px;border:1px solid #dce8dd;background:#f1f9f1;color:#559465;padding:5px 9px;border-radius:20px}.editor-wrapper{position:relative;min-height:0;flex:1}.cm-editor{height:100%;font-size:16px;line-height:1.8;color:#364259}.cm-editor.cm-focused{outline:none}.cm-scroller{overflow:auto!important;font-family:Georgia,serif}.cm-editor .cm-content{padding:25px 45px;margin:auto;font-family:Georgia,serif}.cm-line{padding:0!important}.cm-gutters{display:none}.footer{height:34px;flex:none;border-top:1px solid #edf0f6;padding:9px 22px;font-size:10px;display:flex;justify-content:space-between;color:#8b97ab}.status{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#233653;color:#fff;padding:10px 18px;border-radius:9px;font-size:12px;box-shadow:0 5px 15px #0002;display:none;z-index:100}.cm-line:first-child{font-size:29px;font-weight:700;line-height:1.5;color:#1f3155;margin-bottom:14px}.cm-line:nth-child(3){color:#7d8ba1;font-style:italic}.theme-dark{--background-primary:#172135;--background-secondary:#111a2b;--background-modifier-border:#2c3a54;--text-normal:#d5ddeb;--text-muted:#8899b5;--text-accent:#86a7ff;background:#0a1221;color:#c9d4e7}.theme-dark .workspace,.theme-dark .cm-editor{background:#172135;color:#c9d4e7}.theme-dark .sidebar{background:#111a2b}.theme-dark .cm-line:first-child{color:#e4ecff}.theme-dark .topbar,.theme-dark .footer{border-color:#2c3a54}@media(max-width:900px){.app{grid-template-columns:145px 1fr;padding:8px}.sidebar{padding:22px 9px}.brand{font-size:17px}.small{display:none}.cm-content{padding:20px 30px}.topbar{padding:0 16px}}@media(max-width:650px){.app{display:block;padding:0}.sidebar{display:none}.workspace{height:100vh;border-radius:0}.topbar{height:46px}.cm-content{padding:20px}.footer{font-size:9px}.cm-line:first-child{font-size:25px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><em>✎</em> inkspace</div><div class="sub">A place for every thought</div><div class="nav-title">YOUR NOTES</div><button class="note-link active" data-path="Welcome.md">✧ &nbsp; Welcome to Inkspace</button><button class="note-link" data-path="Study.md">▤ &nbsp; Study notes</button><button class="note-link" data-path="Blank.md">＋ &nbsp; Blank writing page</button><div class="small">Type a thought.<br>Circle what matters.<br>Keep it all together.<br><br>This workspace runs the same editor extension as the plugin.</div></aside><main class="workspace"><header class="topbar"><span class="crumb">Notes &nbsp; / &nbsp; <strong id="note-title">Welcome to Inkspace</strong></span><span class="pill">LOCAL · SAVED ON DEVICE</span></header><div class="editor-wrapper" id="editor"></div><footer class="footer"><span id="footer-state">Pencil and keyboard, one surface</span><span>Prototype · device testing required</span></footer></main></div><div class="status" id="status"></div><script src="/preview/bundle.js"></script></body></html>
